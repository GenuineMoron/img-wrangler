# Tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude wrangler-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude wrangler-desktop
      # The Finder extension's menu and requests, without Finder (Swift, built with swiftc).
      # Then the extension itself, built and signed for both chips the way a release does it.
      - if: runner.os == 'macOS'
        run: |
          node apps/desktop/scripts/finder-extension.mjs --test
          node apps/desktop/scripts/finder-extension.mjs
          codesign --verify --strict apps/desktop/src-tauri/gen/finder/WranglerFinder.appex
          lipo -archs apps/desktop/src-tauri/gen/finder/WranglerFinder.appex/Contents/MacOS/WranglerFinder

  bindings:
    name: TypeScript types match the engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wrangler-engine --features ts export_bindings
      - run: git diff --exit-code -- apps/desktop/src/lib/types/engine

  desktop:
    name: Desktop app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p wrangler-desktop --all-targets -- -D warnings
      - run: cargo test -p wrangler-desktop

  interface:
    name: Interface speed and layout (Chromium, WebKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium webkit
      # The self-test with 600 stand-in photos, then every state checked for cut-off,
      # spilling and overlapping controls at three window sizes. A layout fault fails the job.
      - run: pnpm selftest browser --files 600 --engines chromium,webkit --strict --out selftest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest
          path: apps/desktop/selftest

