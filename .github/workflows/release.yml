# A version tag (v0.1.0, v0.1.0-alpha.1 …) builds the app and the command line tool for every
# platform into one draft release, and publishes it only if every build succeeds. Tags with a
# hyphen are marked as pre-releases. Notes come from CHANGELOG.md plus release-notes.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v) == 1 { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
      - id: release
        name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag --title "Wrangler ${GITHUB_REF_NAME#v}" --notes-file notes.md
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  app:
    name: App (${{ matrix.target }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # one .dmg that runs on every Mac, Apple silicon and Intel
          - { os: macos-15, target: universal-apple-darwin, rust: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          # Linux builds on the oldest supported Ubuntu, so they run on any system with glibc 2.35 or newer
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust || matrix.target }}
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # linuxdeploy's own strip can't read newer binaries; AppImages work fine unstripped
          NO_STRIP: 'true'
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.draft.outputs.id }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          # Linux builds on the oldest supported Ubuntu, so they run on any system with glibc 2.35 or newer
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}
      - run: cargo build --release -p img-wrangler --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="img-wrangler-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE NOTICE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/img-wrangler.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/img-wrangler" "$name/"
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber

  publish:
    name: Publish
    needs: [app, cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Arch package recipe, with this release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir arch && cd arch
          deb_x="Wrangler_${v}_amd64.deb" deb_a="Wrangler_${v}_arm64.deb"
          cli_x="img-wrangler-v${v}-x86_64-unknown-linux-gnu.tar.gz" cli_a="img-wrangler-v${v}-aarch64-unknown-linux-gnu.tar.gz"
          gh release download "$GITHUB_REF_NAME" -p "$deb_x" -p "$deb_a" -p "$cli_x" -p "$cli_a"
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$v/" -e "s/@SHA_DEB_X86_64@/$(sum "$deb_x")/" -e "s/@SHA_DEB_AARCH64@/$(sum "$deb_a")/" \
              -e "s/@SHA_CLI_X86_64@/$(sum "$cli_x")/" -e "s/@SHA_CLI_AARCH64@/$(sum "$cli_a")/" ../packaging/arch/PKGBUILD.in > PKGBUILD
          gh release upload "$GITHUB_REF_NAME" PKGBUILD --clobber
      - name: Tidy the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name | select(endswith(".app.tar.gz"))'); do
            gh release delete-asset "$GITHUB_REF_NAME" "$a" --yes
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
