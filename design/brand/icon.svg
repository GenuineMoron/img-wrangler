<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Wrangler app icon: a piece of the unit. Aluminium case, OLED screen showing the Size frame,
       and the orange Run key. 824 px body on a 1024 canvas (macOS grid). -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f3f0"/><stop offset=".45" stop-color="#e7e6e2"/><stop offset="1" stop-color="#d3d2ce"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8650"/><stop offset=".5" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ec4b12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".28"/></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#case)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="#fff" filter="url(#grain)"/>
    <rect x="100" y="100" width="824" height="6" fill="#fff" opacity=".9"/>
  </g>
  <!-- screen -->
  <rect x="196" y="196" width="632" height="404" rx="34" fill="#050505"/>
  <rect x="196" y="196" width="632" height="404" rx="34" fill="none" stroke="#000" stroke-width="4"/>
  <!-- original, dashed -->
  <rect x="262" y="262" width="390" height="272" fill="none" stroke="#7c7c77" stroke-width="7" stroke-dasharray="16 14"/>
  <!-- the frame, glowing blue, with the picture padded inside -->
  <g filter="url(#glow)">
    <rect x="262" y="262" width="272" height="272" fill="#3d5cff" fill-opacity=".18" stroke="#7b8fff" stroke-width="12"/>
  </g>
  <rect x="300" y="327" width="196" height="142" fill="#ecebe7" fill-opacity=".22"/>
  <circle cx="534" cy="262" r="22" fill="#050505" stroke="#7b8fff" stroke-width="10"/>
  <!-- dot readout -->
  <g fill="#ff5a1f" filter="url(#glow)">
    <circle cx="640" cy="470" r="11"/><circle cx="672" cy="470" r="11"/><circle cx="704" cy="470" r="11"/><circle cx="736" cy="470" r="11"/>
    <circle cx="640" cy="502" r="11"/><circle cx="736" cy="502" r="11"/><circle cx="640" cy="534" r="11"/><circle cx="672" cy="534" r="11"/><circle cx="704" cy="534" r="11"/><circle cx="736" cy="534" r="11"/>
  </g>
  <!-- keys -->
  <rect x="196" y="672" width="196" height="148" rx="30" fill="#b3b3b1"/>
  <rect x="196" y="664" width="196" height="148" rx="30" fill="#f5f5f4"/>
  <rect x="424" y="672" width="404" height="148" rx="34" fill="#b33a0b"/>
  <rect x="424" y="660" width="404" height="148" rx="34" fill="url(#key)"/>
  <rect x="424" y="660" width="404" height="3" rx="2" fill="#fff" opacity=".45"/>
</svg>
