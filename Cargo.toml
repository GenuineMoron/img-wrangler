[workspace]
resolver = "3"
members = ["crates/engine", "crates/integrate", "crates/cli", "apps/desktop/src-tauri"]
# The desktop app needs WebKitGTK on Linux; build it with `pnpm tauri build` or `-p wrangler-desktop`.
default-members = ["crates/engine", "crates/integrate", "crates/cli"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Sean Hawkey"]
repository = "https://github.com/GenuineMoron/img-wrangler"

[workspace.dependencies]
wrangler-engine = { path = "crates/engine" }
wrangler-integrate = { path = "crates/integrate" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
