# Publishes the download page, the short install command and the update manifest (latest.json,
# copied from the newest release) to genuinemoron.github.io/img-wrangler. The page reads files and
# sizes from the newest release itself, so this runs when the page, the design system or the
# install scripts change, and after each release (started by release.yml).
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - design/system/**
      - install.sh
      - install.ps1
      - .github/assets/demo.webp
      - .github/assets/social.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Put the site together
        run: |
          mkdir -p out/system
          cp -R site/. out/
          cp -R design/system/tokens.css design/system/components.css design/system/fonts.css design/system/fonts design/system/tex out/system/
          cp .github/assets/demo.webp .github/assets/social.jpg out/
          # the short command: curl -fsSL https://genuinemoron.github.io/img-wrangler/install | sh
          cp install.sh out/install
          cp install.sh install.ps1 out/
      - name: The update manifest from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft | not)][0].tagName')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir out || echo "$tag has no latest.json yet"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5
